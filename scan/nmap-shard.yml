#V2
settings:
  name: "Nmap shard: scan this instance's slice of a host list"
  description: "Child playbook launched with --count under the v2 platform. Each instance reads $SATORI_COUNT/$SATORI_COUNT_INDEX and scans only its slice of the host list, writing results to nmap.txt for the orchestrator to collect. Number of top ports is parametrizable via PORTS (default 1000)."
  image: debian
  files: true
  timeout: 3600
  author:
    - https://github.com/nmap
  example: satori-v2 run satori://scan/nmap-shard.yml --count 2 -d HOST="satori.ci\nsatori-ci.com" -d PORTS=1000 --files

install:
  - apt-get update >>/dev/null; apt-get install -qy nmap >>/dev/null

scan:
  assertReturnCode: 0
  run:
    - |
      # Split the received HOST blob (newline / comma / space separated) into one host per line.
      printf '%b' "${{HOST}}" | tr ', ' '\n' | sed '/^[[:space:]]*$/d' | sort -u > all.txt

      # Each --count instance scans only its shard (its own container / egress IP).
      # $SATORI_COUNT_INDEX is 1-based (1..$SATORI_COUNT), so shift to 0-based for the modulo.
      awk "(NR - 1) % ${SATORI_COUNT:-1} == (${SATORI_COUNT_INDEX:-1} - 1)" all.txt > mine.txt
      echo "# Shard ${SATORI_COUNT_INDEX:-1}/${SATORI_COUNT:-1} - Hosts: $(wc -l < mine.txt)"

      # Number of top ports to scan; PORTS defaults to 1000 when not passed with -d.
      PORTS="${PORTS:-1000}"
      : > nmap.txt
      while read -r H; do
        echo "===== nmap $H (shard ${SATORI_COUNT_INDEX:-1}/${SATORI_COUNT:-1}, top ${PORTS} ports) =====" | tee -a nmap.txt
        nmap -Pn --top-ports "${PORTS}" -sS -A --open "$H" | tee -a nmap.txt
      done < mine.txt
