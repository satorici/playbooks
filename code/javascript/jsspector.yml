settings:
  image: public.ecr.aws/docker/library/rust
  name: JSSpector

install:
  - command -v jsspector >/dev/null || [ -x "$HOME/.cargo/bin/jsspector" ] || cargo install --git https://github.com/satoridev01/JSSpector --locked jsspector

test:
  run:
    - sh -c 'PATH="$HOME/.cargo/bin:$PATH" jsspector scan --json ./'
