settings:
  image: node:24-bookworm
  name: JSSpector
  cpu: 8192
  memory: 16384
  timeout: 1800

# JSSpector finds attacker-controlled data reaching dangerous sinks and confirms each finding by
# running the application: in a disposable Docker container when Docker is available (a local run
# with `satori local`), otherwise inside this job itself (`--local`, the cloud job), where the
# backing services an application needs (MongoDB, Redis) are provisioned on demand. The JSON report
# carries each finding's `exploitation` and `poc`, the scanned `git` revision and, for every
# verified finding, a `fix`: a change proven to stop the exploit while a benign request keeps its
# behavior, with the change as a unified diff. Exact fixes learned from earlier proofs are replayed
# deterministically first; an LLM CLI is an optional fallback, and its candidate must pass the same
# exploit and benign controls before it is reported as proven.
install:
  setShell: true
  setShellQuoteInputs: true
  run:
    - command -v lsof >/dev/null 2>&1 && command -v g++ >/dev/null 2>&1 && command -v curl >/dev/null 2>&1 && command -v xz >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq ca-certificates curl xz-utils lsof build-essential python3; }
    - |
      set -eu
      JSSPECTOR_VERSION=0.1.1
      case "$(uname -m)" in
        x86_64|amd64)
          JSSPECTOR_TARGET=x86_64-unknown-linux-gnu
          JSSPECTOR_SHA256=6d01307d90903108a15beabaf2280bff62acd3062bcb020ecdea8cd795775daf
          ;;
        aarch64|arm64)
          JSSPECTOR_TARGET=aarch64-unknown-linux-gnu
          JSSPECTOR_SHA256=22089301de3cf70a0dbf3ab2517326f8fef317e383703462a109ba19f3e89096
          ;;
        *)
          echo "unsupported JSSpector architecture: $(uname -m)" >&2
          exit 2
          ;;
      esac
      JSSPECTOR_ARCHIVE="jsspector-${JSSPECTOR_TARGET}.tar.xz"
      JSSPECTOR_TMP="$(mktemp -d)"
      curl --proto '=https' --tlsv1.2 -fsSL \
        "https://github.com/satoridev01/JSSpector/releases/download/v${JSSPECTOR_VERSION}/${JSSPECTOR_ARCHIVE}" \
        -o "${JSSPECTOR_TMP}/${JSSPECTOR_ARCHIVE}"
      printf '%s  %s\n' "$JSSPECTOR_SHA256" "${JSSPECTOR_TMP}/${JSSPECTOR_ARCHIVE}" | sha256sum -c -
      tar -xJf "${JSSPECTOR_TMP}/${JSSPECTOR_ARCHIVE}" -C "$JSSPECTOR_TMP"
      mkdir -p "$HOME/.jsspector/bin"
      install -m 0755 \
        "${JSSPECTOR_TMP}/jsspector-${JSSPECTOR_TARGET}/jsspector" \
        "$HOME/.jsspector/bin/jsspector"
      "$HOME/.jsspector/bin/jsspector" --version

test:
  setShell: true
  run:
    - |
      export PATH="$HOME/.jsspector/bin:$HOME/.cargo/bin:$PATH"
      VERIFY_LOCAL=""
      docker info >/dev/null 2>&1 || VERIFY_LOCAL="--local"
      jsspector scan . --verify=strict $VERIFY_LOCAL --no-fix-llm --allow-incomplete --format json
