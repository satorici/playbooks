# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED PERMISSIONS  (AWS IAM access keys)
#
#   Inputs (-d):  AWS_ACCESS_KEY  AWS_SECRET_KEY  AWS_ACCOUNT_ID
#                  (scans us-east-1 only)
#   Programmatic access keys of a dedicated read-only IAM user (or assumed role).
#
#   Attach these AWS managed policies to that IAM principal  (IAM -> Users -> <user> ->
#   Add permissions -> Attach policies directly):
#        - arn:aws:iam::aws:policy/SecurityAudit
#        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
#   Prowler's documented read-only baseline; a few checks need small extra grants -
#   see the AWS "Requirements" page at https://docs.prowler.com
#
#   AWS_ACCOUNT_ID is a fail-closed allowlist for dynamic verification. Verification
#   only runs when the authenticated account matches this exact account ID.
# ─────────────────────────────────────────────────────────────────────────────
settings:
  name: "Prowler (satoridev01 fork): AWS Security Best Practices Assessment Tool"
  description: "Prowler is an open-source security tool to perform AWS security best practices assessments, audits, incident response, continuous monitoring, hardening and forensics readiness. It contains hundreds of controls covering CIS, PCI-DSS, ISO27001, GDPR, HIPAA, FFIEC, SOC2, AWS FTR, ENS and custom security frameworks."
  image: ghcr.io/satoridev01/prowler:aws-poc-verification
  files: True
  author:
    - https://github.com/prowler-cloud/prowler
    - https://github.com/satoridev01/prowler
  gallery:
    - https://files.catbox.moe/xsbsqj.png
  redacted:
    - AWS_ACCESS_KEY
    - AWS_SECRET_KEY
  example: satori run satori://cloud/aws-prowler2.yml -d AWS_ACCESS_KEY=key -d AWS_SECRET_KEY=secret -d AWS_ACCOUNT_ID=123456789012 --report --output

prowler:
  test:
    assertReturnCode: 0
    run:
      - export AWS_ACCESS_KEY_ID=${{AWS_ACCESS_KEY}}; export AWS_SECRET_ACCESS_KEY=${{AWS_SECRET_KEY}}; export AWS_EC2_METADATA_DISABLED=true; export PROWLER_VERIFY_ALLOWED_ACCOUNT_IDS=${{AWS_ACCOUNT_ID}}; /home/prowler/.venv/bin/prowler aws -M json-ocsf -o ./output -F report --region us-east-1 --verify --ignore-exit-code-3 --log-level ERROR
    # Trimmed OCSF records as JSON Lines, in the shape Satori's `prowler` parser claims
    # (metadata.product.name, metadata.event_code, finding_info.title). Only FAILs are printed:
    #   - a FAIL whose verification ran (verified / not_reproduced / error) is one line per
    #     resource and keeps unmapped.verification, which Satori turns into exploitability;
    #   - every other FAIL is grouped by check: a top-level `count` and up to 5 distinct
    #     `resources` (a check with a single failing resource stays a per-resource line).
    # PoC stdout/stderr are printed only for `risk: passive` verifiers.
    result:
      - |
        /home/prowler/.venv/bin/python -c 'import json,sys
        o=["Critical","High","Medium","Low","Informational"];ran=("verified","not_reproduced","error");single=[];groups=dict()
        def cut(v,n=500):
            return v[:n] if isinstance(v,str) else None
        def res(x):
            return [dict(uid=r.get("uid"),name=r.get("name"),region=r.get("region")) for r in (x.get("resources") or []) if isinstance(r,dict)][:1]
        def slim(x):
            m=x.get("remediation") if isinstance(x.get("remediation"),dict) else dict()
            return dict(metadata=dict(product=dict(name="Prowler"),event_code=x["metadata"]["event_code"]),finding_info=dict(title=x["finding_info"]["title"]),severity=x.get("severity"),status_code="FAIL",status_detail=cut(x.get("status_detail")),risk_details=cut(x.get("risk_details")),resources=res(x),remediation=dict(desc=cut(m.get("desc")),references=[u for u in (m.get("references") or []) if isinstance(u,str)][:1]))
        def verification(x):
            u=x.get("unmapped");v=u.get("verification") if isinstance(u,dict) else None
            if not isinstance(v,dict) or v.get("outcome") not in ran:return None
            v=dict(v);p=v.get("poc")
            if isinstance(p,dict):
                p=dict(p);v["poc"]=p
                for k in ("stdout","stderr"):
                    if v.get("risk")=="passive" and isinstance(p.get(k),str):p[k]=p[k][:2000]
                    else:p.pop(k,None)
            return v
        for x in json.load(open(sys.argv[1])):
            if x.get("status_code")!="FAIL":continue
            e=slim(x);v=verification(x)
            if v:
                e["unmapped"]=dict(verification=v);single.append(e);continue
            g=groups.setdefault(e["metadata"]["event_code"],[]);g.append(e)
        for g in groups.values():
            e=g[0]
            if len(g)>1:
                seen=dict()
                for i in g:
                    for r in i["resources"]:seen.setdefault(r.get("uid"),r)
                e["count"]=len(g);e["resources"]=list(seen.values())[:5];e.pop("status_detail")
            single.append(e)
        for e in sorted(single,key=lambda e:o.index(e["severity"]) if e["severity"] in o else 9):print(json.dumps(e))' ./output/report.ocsf.json
      # How many FAILs the fork verified, by outcome (`none` = no verification block at all).
      - |
        /home/prowler/.venv/bin/python -c 'import json,sys,collections
        c=collections.Counter()
        for x in json.load(open(sys.argv[1])):
            if x.get("status_code")!="FAIL":continue
            u=x.get("unmapped");v=u.get("verification") if isinstance(u,dict) else None
            c[str(v.get("outcome")) if isinstance(v,dict) else "none"]+=1
        print("FAIL findings by verification outcome:",", ".join(k+"="+str(n) for k,n in sorted(c.items())) or "no FAIL findings")' ./output/report.ocsf.json
