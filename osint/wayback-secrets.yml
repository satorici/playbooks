settings:
  name: "Wayback Secrets: archived-file leaked-credential scan"
  description: "Recovers historical JS/JSON/config files from the Wayback Machine (archive.org) — including content already deleted from the live site — and scans them with Semgrep's p/secrets ruleset for leaked API keys, tokens and credentials. Uses Semgrep (not TruffleHog) for lower false-positive noise; the noisy Twitter/Facebook OAuth rules are excluded. Passive reconnaissance only."
  image: debian
  author:
    - https://github.com/satorici
  example: satori run satori://osint/wayback-secrets.yml -d DOMAIN="cloudflare.com" --report --output

wayback-secrets:
  install:
    - which curl pip3 >/dev/null 2>&1 || (export DEBIAN_FRONTEND=noninteractive && apt-get update -qq && apt-get install -qy curl ca-certificates python3-pip >>/dev/null 2>&1)
    - command -v semgrep >/dev/null 2>&1 || pip3 install semgrep -U -q --disable-pip-version-check --root-user-action=ignore --break-system-packages >/dev/null 2>&1

  run:
    - |
      DOMAIN="${{DOMAIN}}"
      LIMIT=200
      WORKDIR=/tmp/wb
      mkdir -p "$WORKDIR"
      echo "=== Wayback Secrets Scan: $DOMAIN (up to $LIMIT files) ==="

      fetch() {
        i=0
        while [ "$i" -lt 5 ]; do
          out=$(curl -s -m "$1" "$2" 2>/dev/null)
          if [ -n "$out" ]; then printf '%s' "$out"; return 0; fi
          i=$((i + 1)); sleep 2
        done
      }

      # List unique archived source/config files (one snapshot per URL, HTTP 200)
      echo "Querying CDX for archived files..."
      URLS=$(fetch 90 "https://web.archive.org/cdx/search/cdx?url=$DOMAIN/*&output=text&fl=timestamp,original&collapse=urlkey&filter=statuscode:200&matchType=domain&limit=100000" \
        | grep -iE '\.(js|json|xml|ya?ml|txt|env|config|conf|ini|properties|bak|map)([?#]|$)' \
        | head -n "$LIMIT")

      COUNT=$(printf '%s\n' "$URLS" | grep -c .)
      echo "Archived files to scan: $COUNT"
      if [ "$COUNT" -eq 0 ]; then
        echo "No archived source/config files found for $DOMAIN"
        exit 0
      fi

      # Download the ORIGINAL archived content (id_ modifier = raw, un-rewritten)
      n=0
      printf '%s\n' "$URLS" | while read -r TS ORIG; do
        [ -z "$TS" ] && continue
        n=$((n + 1))
        curl -s -m 30 -o "$WORKDIR/f_${TS}_${n}" \
          "https://web.archive.org/web/${TS}id_/${ORIG}" 2>/dev/null
      done
      echo "Downloaded $(ls -1 "$WORKDIR" | wc -l) files"

      # Scan recovered files for leaked secrets with Semgrep's p/secrets ruleset.
      # Excludes the two noisiest generic OAuth rules (Twitter/Facebook) — high false-positive rate.
      echo "=== semgrep p/secrets scan ==="
      semgrep --config 'p/secrets' -q --max-chars-per-line 1024 \
        --exclude-rule generic.secrets.security.detected-twitter-oauth.detected-twitter-oauth \
        --exclude-rule generic.secrets.security.detected-facebook-oauth.detected-facebook-oauth \
        "$WORKDIR"

  # Grade by Semgrep's severity glyph: ❯❯❱ = ERROR (high-confidence secret) → High;
  # ❯❱ = WARNING (medium-confidence) → Medium. Archived secrets may be rotated, so High (not
  # Critical) — mirrors the standard secrets/semgrep.yml grading.
  high:
    setOutput: wayback-secrets.run
    setSeverity: 2
    assertStdoutNotContains: " ❯❯❱ "

  medium:
    setOutput: wayback-secrets.run
    setSeverity: 3
    assertStdoutNotContains: " ❯❱ "
