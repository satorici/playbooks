settings:
  name: "HaveIBeenPwned: Breach exposure check"
  description: "Checks if employee credentials from the target domain have appeared in known data breaches using the Have I Been Pwned API. Requires HIBP_API_KEY."
  mitigation: "Force password resets for any exposed accounts, enforce MFA, block reuse of known-breached passwords, and monitor your login endpoints for credential-stuffing."
  image: debian
  author:
    - https://github.com/satorici
  example: satori run satori://osint/haveibeenpwned.yml -d DOMAIN="linkedin.com" -d COMPANY="LinkedIn" -d HIBP_API_KEY="your_key" -d HUNTER_API_KEY="your_key" --report --output
  redacted:
    - HIBP_API_KEY
    - HUNTER_API_KEY

haveibeenpwned:
  install:
    - command -v curl >/dev/null 2>&1 && command -v jq >/dev/null 2>&1 || (export DEBIAN_FRONTEND=noninteractive && apt-get update -qq && apt-get install -qy curl jq ca-certificates >>/dev/null)
    # Without a key every lookup is refused, which would read as no breach.
    - '[ -n "${{HIBP_API_KEY}}" ] || { echo "HIBP_API_KEY is not set"; exit 1; }'

  domain_breaches:
    setSeverity: 2
    assertStdoutNotContains: "CRITICAL"
    run:
      - |
        echo "=== HIBP Domain Breach Search: ${{DOMAIN}} ==="
        RESULT=$(curl -s -H "hibp-api-key: ${{HIBP_API_KEY}}" \
          -H "user-agent: Satori-CI" \
          "https://haveibeenpwned.com/api/v3/breaches?domain=${{DOMAIN}}")
        if [ "$RESULT" = "[]" ] || [ -z "$RESULT" ]; then
          echo "No breaches found for domain ${{DOMAIN}}"
        else
        echo "=== Breaches Found ==="
        echo "$RESULT" | jq -r '.[] | "Breach: \(.Name)\n  Date: \(.BreachDate)\n  Records: \(.PwnCount)\n  Data Types: \(.DataClasses | join(", "))\n  Description: \(.Description[:150])...\n"'
        echo "=== Summary ==="
        TOTAL=$(echo "$RESULT" | jq 'length')
        TOTAL_RECORDS=$(echo "$RESULT" | jq '[.[].PwnCount] | add')
        HAS_PASSWORDS=$(echo "$RESULT" | jq '[.[] | select(.DataClasses[] == "Passwords")] | length')
        echo "Total breaches: $TOTAL"
        echo "Total exposed records: $TOTAL_RECORDS"
        echo "Breaches with passwords: $HAS_PASSWORDS"
        if [ "$HAS_PASSWORDS" -gt 0 ]; then
          echo "CRITICAL: Password data was exposed in $HAS_PASSWORDS breach(es)"
        fi
        fi

        # Also search public breaches list by company name (no API key needed)
        echo ""
        echo "=== HIBP Public Breach Search: ${{COMPANY}} ==="
        ALL_BREACHES=$(curl -s -H "user-agent: Satori-CI" "https://haveibeenpwned.com/api/v3/breaches")
        COMPANY_LOWER=$(echo "${{COMPANY}}" | tr '[:upper:]' '[:lower:]')
        DOMAIN_BASE=$(echo "${{DOMAIN}}" | cut -d. -f1)
        MATCHES=$(echo "$ALL_BREACHES" | jq -r --arg company "$COMPANY_LOWER" --arg domain "$DOMAIN_BASE" '[.[] | select((.Name | ascii_downcase | contains($company)) or (.Title | ascii_downcase | contains($company)) or (.Domain | ascii_downcase | contains($domain)))] | .[] | "Breach: \(.Name)\n  Domain: \(.Domain)\n  Date: \(.BreachDate)\n  Records: \(.PwnCount)\n  Passwords: \(if (.DataClasses | index("Passwords")) then "YES" else "No" end)\n"' 2>/dev/null)
        if [ -n "$MATCHES" ]; then
          echo "$MATCHES"
          echo "BREACH_HISTORY_FOUND: ${{COMPANY}} appears in HIBP public breach database"
        else
          echo "No public breach history found for ${{COMPANY}}"
        fi

  # A breach of ANOTHER site that held staff addresses is a credential-stuffing source for this company,
  # so the addresses Hunter.io publishes for the domain are looked up one by one. Addresses are masked
  # in the output: the count and the breaches are the finding, not who.
  staff_credentials:
    setSeverity: 2
    assertStdoutNotContains: "STAFF_CREDENTIALS_EXPOSED"
    run:
      - |
        echo "=== HIBP staff address check: ${{DOMAIN}} ==="
        EMAILS=$(curl -s "https://api.hunter.io/v2/domain-search?domain=${{DOMAIN}}&api_key=${{HUNTER_API_KEY}}&limit=10" | jq -r '.data.emails[]?.value' 2>/dev/null)
        if [ -z "${{HUNTER_API_KEY}}" ]; then echo "Not checked: HUNTER_API_KEY is not set"; exit 0; fi
        if [ -z "$EMAILS" ]; then echo "No published staff addresses to check"; exit 0; fi
        EXPOSED=0; CHECKED=0
        for E in $EMAILS; do
          CHECKED=$((CHECKED+1))
          # The lowest paid tier allows 10 lookups a minute.
          [ "$CHECKED" -gt 1 ] && sleep 7
          R=$(curl -s -H "hibp-api-key: ${{HIBP_API_KEY}}" -H "user-agent: Satori-CI" "https://haveibeenpwned.com/api/v3/breachedaccount/$E?truncateResponse=false")
          NAMES=$(echo "$R" | jq -r 'if type == "array" then [.[] | select(.DataClasses | index("Passwords")) | .Name] | join(", ") else "" end' 2>/dev/null)
          MASKED=$(echo "$E" | sed -E 's/^(.).*@/\1***@/')
          if [ -n "$NAMES" ]; then EXPOSED=$((EXPOSED+1)); echo "  $MASKED: passwords exposed in $NAMES"; fi
        done
        echo "Staff addresses checked: $CHECKED, with passwords in a breach: $EXPOSED"
        [ "$EXPOSED" -gt 0 ] && echo "STAFF_CREDENTIALS_EXPOSED: $EXPOSED of $CHECKED published staff addresses had passwords in another site's breach"
        exit 0
