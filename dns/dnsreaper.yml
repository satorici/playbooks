settings:
  name: "dnsReaper: subdomain takeover detection with CNAME-target verification"
  description: "dnsReaper checks DNS records for subdomain takeover using 50+ service signatures. Unlike fingerprint-only scanners it verifies the record type AND that the CNAME actually points to the claimed provider before flagging, so a live site behind CloudFront/Netlify is not mis-reported as vulnerable - far fewer false positives."
  mitigation: "Remove or reclaim any dangling DNS record pointing to a deprovisioned third-party service so an attacker cannot register the resource and take over the subdomain."
  image: python:3.11-slim
  author:
    - https://github.com/punk-security
  example: satori run satori://dns/dnsreaper.yml -d DOMAIN="nonexistent-app-12345.herokuapp.com" --report --output
  # NOTE: subdomain takeover affects dangling SUBDOMAINS. Pass a discovered subdomain (or run per-subdomain
  # from subfinder output) for a meaningful scan; an apex/main site normally has no takeover surface.
  # dnsReaper is installed from source: its official Docker image (python:3.11-alpine) ships a broken _ssl
  # (musl/OpenSSL symbol mismatch), so a glibc python base + git clone is used instead.

dnsreaper:
  install:
    - export DEBIAN_FRONTEND=noninteractive && apt-get update -qq && apt-get install -qy git python3-pip ca-certificates >/dev/null 2>&1 && git clone --depth 1 https://github.com/punk-security/dnsReaper /opt/dnsreaper >/dev/null 2>&1 && pip install --quiet --break-system-packages --root-user-action=ignore -r /opt/dnsreaper/requirements.txt

  test:
    # dnsReaper writes its banner + result line to stderr, so merge stderr into stdout (2>&1) both for
    # the assert and so downstream consumers that read stdout can see it. A clean, completed scan says
    # exactly "We found 0 takeovers"; any confirmed takeover (N >= 1) prints a different count and fails.
    # DOMAIN may contain multiple newline-separated domains — run dnsReaper once per domain and
    # report any takeover found across any of them.
    setSeverity: 2
    assertStdoutContains: "We found 0 takeovers"
    run:
      - |
        echo 0 > /tmp/takeover_count
        printf '%s\n' "${{DOMAIN}}" | grep -v '^[[:space:]]*$' > /tmp/domains.txt
        while IFS= read -r domain; do
          OUT=$(cd /opt/dnsreaper && python3 main.py single --domain "$domain" 2>&1)
          echo "=== $domain ==="
          echo "$OUT"
          COUNT=$(printf '%s' "$OUT" | grep -oE 'We found [0-9]+ takeover' | grep -oE '[0-9]+' || echo 0)
          echo $(( $(cat /tmp/takeover_count) + ${COUNT:-0} )) > /tmp/takeover_count
        done < /tmp/domains.txt
        echo "We found $(cat /tmp/takeover_count) takeovers across all domains"
