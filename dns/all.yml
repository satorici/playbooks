settings:
  name: "All DNS + OSINT: discover an organisation's full attack surface"
  description: "Framework entrypoint that maps an organisation's external footprint by fanning out every subdomain and corporate-structure source in parallel: subfinder (passive OSINT subdomains), dns-enum (brute-force / crt.sh subdomains), dnsx (confirms which hosts resolve to real IPs), cert-org-search (domains registered under the same org name via certificate transparency), sec-subsidiaries (subsidiaries disclosed in SEC filings) and thecompaniesapi (corporate structure -> related entities). Imports run concurrently via setParallelImports; each source prints its own discovered subdomains/entities. cdncheck is intentionally excluded - it only classifies CDN/cloud origins and contributes no new subdomains."
  mitigation: "Reconcile every domain, subdomain and related entity discovered here against your authoritative asset inventory, decommission stale or forgotten hosts, reclaim or investigate any domain you do not recognise, and ensure each live asset is patched and monitored to shrink your external attack surface."
  image: debian
  cpu: 4096
  memory: 8192
  timeout: 900
  redacted:
    - THECOMPANIESAPI
  author:
    - https://github.com/satorici
    - https://github.com/projectdiscovery
  example: satori run satori://dns/all.yml -d DOMAIN="satori.ci" -d COMPANY="Satori" -d THECOMPANIESAPI="$THECOMPANIESAPI" --report --output

setParallelImports: true

import:
  # --- Attack Surface Discovery (subdomains) ---
  - satori://dns/passive/subfinder.yml
  - satori://dns/dns-enum.yml
  - satori://dns/dnsx.yml

  # --- Corporate Structure & Related Entities ---
  - satori://osint/cert-org-search.yml
  - satori://osint/sec-subsidiaries.yml
  - satori://osint/thecompaniesapi.yml
# NOTE: no `combine` step here. A step referencing ${{import.N...}} outputs is
# incompatible with setParallelImports (the cross-import refs are not wired into
# the variable context under parallel execution — they fail with "Bad substitution").
# Each imported source prints its own subdomains; consume them per-import.
